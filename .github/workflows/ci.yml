name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Test
        # Integration tests skip themselves without an API key, so CI is offline.
        run: bun test

      - name: Build
        run: bun run build

      - name: Verify the published artifact runs on Node
        run: |
          node dist/cli/translator-sync.js --version
          node dist/cli/translator-sync.js --help > /dev/null

      - name: Verify there are no runtime dependencies
        run: |
          count=$(node -e "const p=require('./package.json');console.log(Object.keys(p.dependencies||{}).length)")
          echo "runtime dependencies: $count"
          test "$count" = "0"

      - name: Pack
        run: bun pm pack --dry-run
