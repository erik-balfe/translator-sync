name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC: npm and JSR verify this workflow instead of a stored token

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # Trusted publishing needs Node >= 22.14.0 and npm >= 11.5.1.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Upgrade npm for OIDC publishing
        run: |
          npm install --global npm@latest
          npm --version

      - run: bun install --frozen-lockfile

      - name: Verify before publishing
        run: |
          bun run type-check
          bun test
          bun run build
          node dist/cli/translator-sync.js --version

      # No NODE_AUTH_TOKEN on purpose: npm exchanges the GitHub OIDC token for
      # short-lived credentials and attaches a provenance statement. Requires a
      # Trusted Publisher entry for this repo and this workflow file on npmjs.com.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Publish to JSR
        run: npx --yes jsr publish
